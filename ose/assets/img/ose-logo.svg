<?xml version="1.0" encoding="UTF-8"?>
<!--
  OSE primary logo — canonical brand mark. Identical to the in-app
  GlowingO and the Android splash icon. Source of truth lives in the
  OSE app repo at branding/ose_logo.svg — keep this file in sync.
-->

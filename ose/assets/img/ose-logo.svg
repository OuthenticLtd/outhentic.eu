    <defs>
        <linearGradient id="oseRingGradient" x1="24" y1="54" x2="84" y2="54" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#4AA3FF"/>
            <stop offset="50%" stop-color="#FFFFFF"/>
            <stop offset="100%" stop-color="#FF8A2A"/>
        </linearGradient>
    </defs>

    <circle cx="54" cy="54" r="30" fill="#0A0A0A"/>


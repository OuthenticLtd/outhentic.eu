<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="OSE — Outhentic Sound Engine">
  <defs>
    <linearGradient id="oseRing" x1="0" y1="0.5" x2="1" y2="0.5">
      <stop offset="0" stop-color="#4FA8FF"/>
      <stop offset="0.45" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FF8B3D"/>
    </linearGradient>
  </defs>
  <!-- Square black background (matches the master) -->
  <rect width="100" height="100" fill="#000"/>
  <!-- Gradient ring -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="url(#oseRing)" stroke-width="5"/>
  <!-- Inner solid black -->
  <circle cx="50" cy="50" r="33" fill="#000"/>
  <!-- Stylised waveform: flat tail · 4 peaks of varying height · flat tail -->
  <path d="M22 50 H30 L33 44 L36 56 L39 30 L42 70 L45 38 L48 62 L51 26 L54 74 L57 36 L60 64 L63 46 L66 54 L69 50 H78"
        fill="none" stroke="#FFFFFF" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

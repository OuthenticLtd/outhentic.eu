    <path d="M 29,54 L 35.25,54 L 39,46.5 L 42.75,61.5 L 46.5,41.5 L 50.25,66.5 L 54,36.5 L 57.75,71.5 L 61.5,41.5 L 65.25,61.5 L 69,46.5 L 72.75,54 L 79,54"

              <text x="124" y="36" fill="#7A7A82" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">SHARP</text>

            <!-- Bottom hint bar -->
            <rect x="130" y="770" width="120" height="4" rx="2" fill="#1c1c22"/>

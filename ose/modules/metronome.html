          <svg viewBox="0 0 360 780">
            <rect width="360" height="780" fill="#050507"/>
            <rect x="0" y="20" width="360" height="56" fill="#0a0a0d"/>
            <text x="22" y="56" fill="#ECECEE" font-family="Inter, sans-serif" font-size="14" font-weight="700" letter-spacing="3">METRONOME</text>
            <circle cx="332" cy="48" r="11" fill="#15151a" stroke="rgba(255,255,255,0.14)"/>
            <circle cx="332" cy="48" r="3" fill="#7A7A82"/>

              <circle cx="100" cy="160" r="14" fill="#FF8B3D"/>
              <circle cx="160" cy="160" r="10" fill="#15151a" stroke="rgba(255,255,255,0.18)"/>

            <text x="180" y="290" fill="#ECECEE" font-family="Inter, sans-serif" font-size="80" font-weight="700" text-anchor="middle">120</text>
            <text x="180" y="320" fill="#7A7A82" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="3" text-anchor="middle">BPM</text>
            <!-- - / + -->
            <circle cx="80"  cy="280" r="22" fill="#15151a" stroke="rgba(255,255,255,0.14)"/>
            <line x1="68" y1="280" x2="92" y2="280" stroke="#ECECEE" stroke-width="2"/>
            <circle cx="280" cy="280" r="22" fill="#15151a" stroke="rgba(255,255,255,0.14)"/>
            <line x1="268" y1="280" x2="292" y2="280" stroke="#ECECEE" stroke-width="2"/>
            <line x1="280" y1="268" x2="280" y2="292" stroke="#ECECEE" stroke-width="2"/>
            <!-- Time sig -->
            <rect x="14" y="358" width="332" height="90" rx="14" fill="#15151a" stroke="rgba(255,255,255,0.08)"/>
            <text x="30" y="384" fill="#7A7A82" font-family="JetBrains Mono, monospace" font-size="9" letter-spacing="2">TIME SIGNATURE</text>
            <circle cx="60"  cy="416" r="20" fill="#0a0a0d" stroke="rgba(255,255,255,0.14)"/>
            <line x1="50" y1="416" x2="70" y2="416" stroke="#ECECEE" stroke-width="2"/>
            <text x="180" y="425" fill="#ECECEE" font-family="Inter, sans-serif" font-size="32" font-weight="700" text-anchor="middle">4 / 4</text>
            <circle cx="300" cy="416" r="20" fill="#0a0a0d" stroke="rgba(255,255,255,0.14)"/>
            <line x1="290" y1="416" x2="310" y2="416" stroke="#ECECEE" stroke-width="2"/>
            <line x1="300" y1="406" x2="300" y2="426" stroke="#ECECEE" stroke-width="2"/>
            <!-- Transport -->
            <rect x="14" y="468" width="332" height="80" rx="14" fill="#0a0a0d" stroke="rgba(255,255,255,0.08)"/>
            <circle cx="180" cy="508" r="22" fill="url(#metGrad)"/>
            <polygon points="174,499 174,517 189,508" fill="#000"/>
            <defs>
              <linearGradient id="metGrad" x1="0" y1="0.5" x2="1" y2="0.5">
                <stop offset="0" stop-color="#4FA8FF"/><stop offset="1" stop-color="#FF8B3D"/>
              </linearGradient>
            </defs>
            <!-- Click mix -->
            <rect x="14" y="568" width="332" height="80" rx="14" fill="#15151a" stroke="rgba(255,255,255,0.08)"/>
            <text x="30" y="594" fill="#7A7A82" font-family="JetBrains Mono, monospace" font-size="9" letter-spacing="2">CLICK MIX</text>
            <rect x="30" y="612" width="160" height="6" rx="3" fill="#1c1c22"/>
            <rect x="30" y="612" width="100" height="6" rx="3" fill="#FF8B3D"/>
            <circle cx="130" cy="615" r="9" fill="#ECECEE"/>
            <text x="220" y="624" fill="#ECECEE" font-family="JetBrains Mono, monospace" font-size="13">−6 dB</text>
            <!-- Bottom hint -->
            <rect x="120" y="730" width="120" height="4" rx="2" fill="#1c1c22"/>
